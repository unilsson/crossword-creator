services:
  korsord:
    build: .
    image: crossword-creator:latest
    container_name: crossword-creator
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Hämta och bygg SALDO automatiskt första gången (ca 70 MB nedladdning).
      AUTO_FETCH_SALDO: "${AUTO_FETCH_SALDO:-1}"
      AI_PROVIDER: "${AI_PROVIDER:-none}"
      AI_MODEL: "${AI_MODEL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
    volumes:
      - korsord-data:/data

volumes:
  korsord-data:
